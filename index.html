body.dk{--bg:#0e1713;--c:#16241d;--t:#e6f0ea;--m:#93a79b;--b:#26372e}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--t)}
input,select,button{font:inherit;padding:11px;border-radius:10px;border:1px solid var(--b);background:var(--c);color:var(--t);width:100%;margin:4px 0}
button{background:var(--g);color:#fff;border:0;font-weight:600}
#sb{position:fixed;top:0;bottom:0;left:0;width:230px;background:var(--gd);color:#fff;padding:14px;transform:translateX(-100%);transition:.2s;z-index:5}
#sb.o{transform:none}
.lg{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.lg img{width:46px;border-radius:8px;background:#fff;padding:3px}
.nv{background:none;text-align:left;margin:2px 0;color:#d5eadc;font-weight:500}
.nv.on{background:#ffffff1f;color:#fff}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--c);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:4}
.ic{width:auto;margin:0;padding:8px 12px;background:var(--bg);color:var(--t)}
#pg{padding:14px;max-width:760px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:14px;margin:12px 0}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gr .card{margin:0}
.st b{display:block;font-size:1.7rem}
.m{color:var(--m);font-size:.85rem}
.ck{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--b)}
.ck input{width:24px;height:24px;margin:0;accent-color:var(--g)}
.bar{height:10px;background:var(--b);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g)}
.pr{margin:10px 0}
.r2{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:4px}
.r{display:flex;gap:8px;align-items:center}.r>*{flex:1}
table{width:100%;border-collapse:collapse;font-size:.88rem}
td,th{padding:8px 4px;text-align:left;border-bottom:1px solid var(--b)}
.w{overflow-x:auto}
@media(min-width:800px){#sb{transform:none}.mn{margin-left:230px}#mb{display:none}}

const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);

const ALL=[...W,...S,...O];
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const shift=(s,n)=>{const d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const stat=L=>{let w=0,s=0,p=0,h=0;for(const d in L){const l=L[d];if(W.every(([k])=>l[k]))w++;if(S.every(([k])=>l[k]))s++;if(l.puasa)p++;h+=+l.halaman||0}return{w,s,p,h}};
const cnt=l=>ALL.filter(([k])=>l?.[k]).length;

let me=null,date=today(),LOGS={},USERS=[];
try{if(localStorage.dk)document.body.classList.add("dk")}catch(e){}

A.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
  if(t.id==="out")signOut(auth);
  else if(t.id==="mb")$("sb").classList.toggle("o");
  else if(t.id==="th"){document.body.classList.toggle("dk");try{localStorage.dk=document.body.classList.contains("dk")?1:""}catch(e){}}
  else if(t.dataset.p)go(t.dataset.p)});

function loginView(msg=""){
  A.innerHTML=`<div style="max-width:420px;margin:40px auto;padding:16px"><div class="lg"><img src="${LOGO}"><b style="font-size:1.3rem">Ramadan<br>Al-Amanah</b></div><div class="card"><input id="u" placeholder="Nama pengguna" autocapitalize="none"><input id="p" type="password" placeholder="PIN" inputmode="numeric"><button id="go">Masuk</button><p class="m" id="msg">${msg}</p></div></div>`;
  $("go").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("u").value.trim().toLowerCase()+D,$("p").value)}catch(e){$("msg").textContent="Nama pengguna atau PIN salah."}};
}

async function loadData(){
  const g=me.role==="guru",col=collection(db,"logs"),uc=collection(db,"users");
  LOGS={};USERS=[];
  const add=x=>{const d=x.data();(LOGS[d.uid]??={})[d.tanggal]=d};
  if(me.role==="murid"){(await getDocs(query(col,where("uid","==",me.uid)))).forEach(add);USERS=[me];return}
  const [ls,us]=await Promise.all([getDocs(g?query(col,where("kelas","==",me.kelas)):col),getDocs(g?query(uc,where("kelas","==",me.kelas)):uc)]);
  ls.forEach(add);
  us.forEach(x=>{const d=x.data();if(d.role==="murid")USERS.push({id:x.id,...d})});
}

function shell(){
  const nv=me.role==="murid"?[["dash","🏠 Dashboard"],["input","✍️ Input Harian"]]:[["dash","🏠 Dashboard"],["siswa","👥 Daftar Siswa"],...(me.role==="admin"?[["akun","➕ Kelola Akun"]]:[])];
  const sub=me.role==="murid"?"Siswa · "+esc(me.kelas):me.role==="guru"?"Guru · "+esc(me.kelas):"Panitia Ramadan";
  A.innerHTML=`<nav id="sb"><div class="lg"><img src="${LOGO}"><b>Ramadan<br>Al-Amanah</b></div>${nv.map(([p,t])=>`<button class="nv" data-p="${p}">${t}</button>`).join("")}</nav><div class="mn"><header><button id="mb" class="ic">☰</button><div style="flex:1"><b>${esc(me.nama)}</b><div class="m">${sub}</div></div><button id="th" class="ic">🌓</button><button id="out" class="ic">Keluar</button></header><div id="pg"></div></div>`;
}

function dash(){
  const T=today();
  if(me.role==="murid"){const L=LOGS[me.uid]||{},s=stat(L);
    return `<div class="gr">${card("Ibadah hari ini",cnt(L[T])+"/9")}${card("Total halaman",s.h)}</div><div class="card"><b>Perjalanan Ramadan</b>${bar("Salat wajib lengkap",s.w,30)}${bar("Sunnah lengkap (Dhuha + Tarawih)",s.s,30)}${bar("Puasa",s.p,30)}${bar("Bacaan menuju 1 khatam",s.h,604,"halaman")}</div>`}
  const no=USERS.filter(u=>!LOGS[u.id]?.[T]);let h=0;USERS.forEach(u=>h+=stat(LOGS[u.id]||{}).h);
  return `<div class="gr">${card("Total siswa",USERS.length)}${card("Mengisi hari ini",USERS.length-no.length)}${card("Total halaman",h)}${card("Belum mengisi",no.length)}</div><div class="card"><b>Belum mengisi hari ini</b><p class="m">${no.map(u=>esc(u.nama)+" ("+esc(u.kelas)+")").join(", ")||"Semua sudah mengisi 🎉"}</p></div>`;
}

function input(){
  const L=LOGS[me.uid]??={},l=L[date]??={};
  const row=([k,n])=>`<label class="ck"><input type="checkbox" data-k="${k}" ${l[k]?"checked":""}>${n}</label>`;
  return `<div class="card"><div class="r"><button class="ic" id="pv">◀</button><b style="text-align:center">${date}</b><button class="ic" id="nx">▶</button></div><p class="m">Salat wajib</p>${W.map(row).join("")}<p class="m">Salat sunnah</p>${S.map(row).join("")}<p class="m">Lainnya</p>${O.map(row).join("")}<p class="m">Bacaan Al-Qur'an: surat dan ayat</p><input id="sy" maxlength="80" value="${esc(l.surat||"")}" placeholder="Contoh: Al-Baqarah ayat 1-20"><p class="m">Jumlah halaman dibaca hari ini</p><input id="hl" type="number" min="0" max="604" value="${l.halaman||""}"><p class="m" id="st"></p></div>`;
}
function bindIn(){
  const l=LOGS[me.uid][date];
  const save=async()=>{Object.assign(l,{uid:me.uid,kelas:me.kelas||"",nama:me.nama,tanggal:date});$("st").textContent="Menyimpan...";
    try{await setDoc(doc(db,"logs",me.uid+"_"+date),l);$("st").textContent="✓ Tersimpan"}catch(e){$("st").textContent="Gagal menyimpan. Cek koneksi."}};
  document.querySelectorAll("[data-k]").forEach(c=>c.onchange=()=>{l[c.dataset.k]=c.checked;save()});
  $("sy").onchange=()=>{l.surat=$("sy").value.trim();save()};
  $("hl").onchange=()=>{l.halaman=Math.max(0,Math.min(604,+$("hl").value||0));save()};
  $("pv").onclick=()=>{date=shift(date,-1);go("input")};
  $("nx").onclick=()=>{if(date<today()){date=shift(date,1);go("input")}};
}

function siswa(){
  const ks=[...new Set(USERS.map(u=>u.kelas))].sort();
  return `<div class="card"><input id="q" placeholder="Cari nama siswa..."><select id="kf"><option value="">Semua kelas</option>${ks.map(k=>`<option>${esc(k)}</option>`).join("")}</select><div class="w" id="tb"></div></div>`;
}
function fillTb(){
  const q=$("q").value.toLowerCase(),k=$("kf").value,T=today();
  const rows=USERS.filter(u=>(!k||u.kelas===k)&&u.nama.toLowerCase().includes(q)).sort((a,b)=>(a.kelas+a.nama).localeCompare(b.kelas+b.nama)).map(u=>{
    const L=LOGS[u.id]||{},s=stat(L),n=cnt(L[T]),c=!L[T]?"#dc2626":n>=8?"#16a34a":"#d9a008";
    return `<tr><td><span style="color:${c}">●</span> ${esc(u.nama)}<div class="m">${esc(u.kelas)}</div></td><td>${n}/9</td><td>${s.w}</td><td>${s.s}</td><td>${s.p}</td><td>${s.h}</td></tr>`}).join("");
  $("tb").innerHTML=`<table><tr><th>Siswa</th><th>Hari ini</th><th>Wajib</th><th>Sunnah</th><th>Puasa</th><th>Hal.</th></tr>${rows||"<tr><td colspan=6>Tidak ada data.</td></tr>"}</table><p class="m">● hijau: lengkap, kuning: sebagian, merah: belum mengisi. Wajib, Sunnah, Puasa = jumlah hari lengkap.</p>`;
}

function akun(){
  return `<div class="card"><b>Tambah akun</b><input id="nm" placeholder="Nama lengkap"><input id="un" placeholder="Nama pengguna (huruf kecil/angka)" autocapitalize="none"><input id="pn" placeholder="PIN (6 angka)" inputmode="numeric" maxlength="6"><select id="rl"><option value="murid">Murid / wali murid</option><option value="guru">Guru</option></select><input id="kl" placeholder="Kelas (contoh: 3A)"><button id="add">Buat akun</button><p class="m" id="am"></p></div>`;
}
function bindAkun(){
  $("add").onclick=async()=>{
    const nama=$("nm").value.trim(),un=$("un").value.trim().toLowerCase(),pin=$("pn").value.trim(),kelas=$("kl").value.trim().toUpperCase();
    if(!nama||!/^[a-z0-9._]+$/.test(un)||!/^\d{6}$/.test(pin)||!kelas)return $("am").textContent="Lengkapi data. Nama pengguna huruf/angka, PIN 6 angka.";
    try{const sec=getAuth(initializeApp(cfg,"sec"+Date.now())),r=await createUserWithEmailAndPassword(sec,un+D,pin);
      await setDoc(doc(db,"users",r.user.uid),{nama,role:$("rl").value,kelas});await signOut(sec);
      await loadData();go("akun");$("am").textContent="✓ Akun "+un+" dibuat."}
    catch(e){$("am").textContent="Gagal: "+(e.code==="auth/email-already-in-use"?"nama pengguna sudah dipakai":e.code)}};
}

function go(p){
  $("sb").classList.remove("o");
  document.querySelectorAll(".nv").forEach(b=>b.classList.toggle("on",b.dataset.p===p));
  $("pg").innerHTML=({dash,input,siswa,akun})[p]();
  if(p==="input")bindIn();
  if(p==="siswa"){fillTb();$("q").oninput=fillTb;$("kf").onchange=fillTb}
  if(p==="akun")bindAkun();
}

onAuthStateChanged(auth,async u=>{
  if(!u){me=null;return loginView()}
  try{
    if(u.email===ADMIN)me={uid:u.uid,id:u.uid,role:"admin",nama:"Admin Panitia"};
    else{const s=await getDoc(doc(db,"users",u.uid));if(!s.exists())throw 0;me={uid:u.uid,id:u.uid,...s.data()}}
    await loadData();shell();go("dash");
  }catch(e){await signOut(auth);loginView("Akun belum terdaftar atau gagal memuat data.")}
});

  const row=([k,n])=>`<label class="ck"><input type="checkbox" data-k="${k}" ${l[k]?"checked":""}>${n}</label>`;
  const bc=(l.bacaan||[]).map((e,i)=>`<div class="r2" style="align-items:center"><span>${NM[e.s]} ${e.a}-${e.b}</span><span>${e.h} hal <button class="ic" data-x="${i}">✕</button></span></div>`).join("");
  return `<div class="card"><div class="r"><button class="ic" id="pv">◀</button><b style="text-align:center">${date}</b><button class="ic" id="nx">▶</button></div><p class="m">Salat wajib</p>${W.map(row).join("")}<p class="m">Salat sunnah</p>${S.map(row).join("")}<p class="m">Lainnya</p>${O.map(row).join("")}<p class="m">Bacaan Al-Qur'an hari ini (total ${l.halaman||0} halaman)</p>${bc||'<p class="m">Belum ada bacaan.</p>'}<select id="bs">${NM.map((n,i)=>`<option value="${i}">${i+1}. ${n}</option>`).join("")}</select><div class="r"><input id="a1" type="number" min="1" placeholder="Dari ayat"><input id="a2" type="number" min="1" placeholder="Sampai ayat"><input id="bh" type="number" step="0.5" min="0.5" placeholder="Halaman"></div><p class="m" id="bi">Halaman terisi otomatis (perkiraan), boleh diubah.</p><button id="add2">Tambah bacaan</button><p class="m" id="st"></p></div>`;
};

bindIn=function(){
  const l=LOGS[me.uid][date];
  const save=async()=>{l.halaman=(l.bacaan||[]).reduce((t,e)=>t+e.h,0);Object.assign(l,{uid:me.uid,kelas:me.kelas||"",nama:me.nama,tanggal:date});$("st").textContent="Menyimpan...";
    try{await setDoc(doc(db,"logs",me.uid+"_"+date),l);$("st").textContent="✓ Tersimpan"}catch(e){$("st").textContent="Gagal menyimpan. Cek koneksi."}};
  document.querySelectorAll("[data-k]").forEach(c=>c.onchange=()=>{l[c.dataset.k]=c.checked;save()});
  const f=()=>{const s=+$("bs").value,a=+$("a1").value,b=+$("a2").value;$("bi").textContent=NM[s]+" punya "+AY[s]+" ayat.";if(a>=1&&b>=a&&b<=AY[s])$("bh").value=est(s,a,b)};
  ["bs","a1","a2"].forEach(i=>$(i).oninput=f);
  $("add2").onclick=async()=>{const s=+$("bs").value,a=+$("a1").value,b=+$("a2").value,h=Math.round(+$("bh").value*2)/2;
    if(!(a>=1&&b>=a&&b<=AY[s]))return $("bi").textContent="Ayat tidak valid. "+NM[s]+" punya "+AY[s]+" ayat.";
    if(!(h>0))return $("bi").textContent="Isi jumlah halaman.";
    (l.bacaan??=[]).push({s,a,b,h});await save();go("input")};
  document.querySelectorAll("[data-x]").forEach(x=>x.onclick=async()=>{l.bacaan.splice(+x.dataset.x,1);await save();go("input")});
  $("pv").onclick=()=>{date=shift(date,-1);go("input")};
  $("nx").onclick=()=>{if(date<today()){date=shift(date,1);go("input")}};
};
  document.head.insertAdjacentHTML("beforeend",`<style>.rp{break-after:page}@media print{#sb,header,.np{display:none!important}.mn{margin:0!important}body{background:#fff;color:#000}#pg{max-width:none;padding:0}.card{border:0;margin:0}}</style>`);
const pred=v=>v>=85?"Sangat Baik":v>=70?"Baik":v>=50?"Cukup":"Perlu Ditingkatkan";
const srt=a=>[...a].sort((x,y)=>(x.kelas+x.nama).localeCompare(y.kelas+y.nama));
const rk=u=>{const L=LOGS[u.id]||{},ds=Object.values(L),c=k=>ds.filter(l=>l[k]).length;
  return{c,s:stat(L),av:Math.round(ALL.reduce((t,[k])=>t+c(k),0)/(30*ALL.length)*100)}};
const raporHTML=u=>{const r=rk(u);
  return `<div class="lg" style="color:var(--t)"><img src="${LOGO}"><div><b style="font-size:1.2rem">Rapor Ramadan 1448 H</b><div class="m">SD Islam Al-Amanah</div></div></div><p><b>${esc(u.nama)}</b><br><span class="m">Kelas ${esc(u.kelas)}</span></p><table><tr><th>Ibadah</th><th>Hari</th><th>%</th></tr>${ALL.map(([k,n])=>`<tr><td>${n}</td><td>${r.c(k)}/30</td><td>${Math.round(r.c(k)/30*100)}%</td></tr>`).join("")}</table>${bar("Salat wajib lengkap",r.s.w,30)}${bar("Sunnah lengkap (Dhuha + Tarawih)",r.s.s,30)}${bar("Puasa",r.s.p,30)}${bar("Bacaan menuju 1 khatam",r.s.h,604,"halaman")}<p><b>Capaian: ${r.av}% · ${pred(r.av)}</b></p><p class="m">Catatan wali kelas:<br><br>______________________________</p>`};
const raporPage=()=>{
  const sel=me.role==="murid"?"":`<select id="rs"><option value="">Semua siswa</option>${srt(USERS).map(u=>`<option value="${u.id}">${esc(u.nama)} (${esc(u.kelas)})</option>`).join("")}</select>`;
  return `<div class="card np">${sel}<div class="r"><button id="pr">🖨️ Cetak / PDF</button>${me.role==="murid"?"":'<button id="xl">⬇️ Unduh Excel</button>'}</div><p class="m">Di jendela cetak, pilih "Simpan sebagai PDF".</p></div><div id="rb"></div>`};
const fillRp=()=>{const v=$("rs")?.value||"",us=v?USERS.filter(u=>u.id===v):srt(USERS);
  $("rb").innerHTML=us.map(u=>`<div class="card rp">${raporHTML(u)}</div>`).join("")||'<p class="m">Belum ada data.</p>'};
const exportXl=()=>{
  const hd=["Nama","Kelas",...ALL.map(a=>a[1]),"Wajib lengkap","Sunnah lengkap","Hari puasa","Total halaman","Capaian %","Predikat"];
  const rows=srt(USERS).map(u=>{const r=rk(u);return[u.nama,u.kelas,...ALL.map(([k])=>r.c(k)),r.s.w,r.s.s,r.s.p,r.s.h,r.av,pred(r.av)]});
  const csv="\uFEFF"+[hd,...rows].map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(",")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="rapor-ramadan.csv";a.click()};
const _go=go,_shell=shell;
shell=function(){_shell();$("sb").insertAdjacentHTML("beforeend",`<button class="nv" data-p="rapor">📄 Rapor Ramadan</button>`)};
go=function(p){
  if(p!=="rapor")return _go(p);
  $("sb").classList.remove("o");
  document.querySelectorAll(".nv").forEach(b=>b.classList.toggle("on",b.dataset.p===p));
  $("pg").innerHTML=raporPage();fillRp();
  if($("rs"))$("rs").onchange=fillRp;
  $("pr").onclick=()=>window.print();
  if($("xl"))$("xl").onclick=exportXl;
};
</script></body></html>
